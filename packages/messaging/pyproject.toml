[project]
name = "mip-messaging"
version = "0.1.0"
description = "Kafka messaging wrappers"
requires-python = ">=3.12"
dependencies = [
    "mip-schemas",
    "aiokafka>=0.11",
    "pydantic>=2.10",
]

[tool.uv.sources]
mip-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip_messaging"]
