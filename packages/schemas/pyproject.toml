[project]
name = "mip-schemas"
version = "0.1.0"
description = "Domain schemas for market intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip_schemas"]
