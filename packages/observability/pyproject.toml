[project]
name = "mip-observability"
version = "0.1.0"
description = "Observability utilities"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.21",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip_observability"]
