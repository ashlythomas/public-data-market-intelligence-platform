[project]
name = "mip-test-fixtures"
version = "0.1.0"
description = "Test fixtures for market intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "mip-schemas",
]

[tool.uv.sources]
mip-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip_test_fixtures"]
