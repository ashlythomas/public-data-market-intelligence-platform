[project]
name = "mip-source-licensing"
version = "0.1.0"
description = "Source licensing enforcement"
requires-python = ">=3.12"
dependencies = [
    "mip-schemas",
]

[tool.uv.sources]
mip-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip_source_licensing"]
