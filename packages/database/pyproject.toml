[project]
name = "mip-database"
version = "0.1.0"
description = "Database models and repositories"
requires-python = ">=3.12"
dependencies = [
    "mip-schemas",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "boto3>=1.35",
    "pydantic-settings>=2.6",
]

[tool.uv.sources]
mip-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip_database"]
