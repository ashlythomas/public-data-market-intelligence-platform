[project]
name = "mip-normalizer"
version = "0.1.0"
description = "Document normalization service"
requires-python = ">=3.12"
dependencies = [
    "mip-schemas",
    "mip-database",
    "mip-messaging",
    "mip-observability",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[tool.uv.sources]
mip-schemas = { workspace = true }
mip-database = { workspace = true }
mip-messaging = { workspace = true }
mip-observability = { workspace = true }

[project.scripts]
mip-normalizer-worker = "mip_normalizer.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip_normalizer"]
