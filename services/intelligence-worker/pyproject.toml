[project]
name = "mip-intelligence-worker"
version = "0.1.0"
description = "Narrative and signal intelligence worker"
requires-python = ">=3.12"
dependencies = [
    "mip-database",
    "mip-messaging",
    "mip-observability",
    "mip-signal-engine",
]

[tool.uv.sources]
mip-database = { workspace = true }
mip-messaging = { workspace = true }
mip-observability = { workspace = true }
mip-signal-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip_intelligence"]

[project.scripts]
mip-intelligence-worker = "mip_intelligence.worker:main"
