[project]
name = "mip-connector-sec-edgar"
version = "0.1.0"
description = "SEC EDGAR filings connector"
requires-python = ">=3.12"
dependencies = [
    "mip-connector-fed",
    "mip-database",
    "mip-messaging",
    "mip-observability",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[tool.uv.sources]
mip-connector-fed = { workspace = true }
mip-database = { workspace = true }
mip-messaging = { workspace = true }
mip-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip_connector_sec_edgar"]

[project.scripts]
mip-connector-sec-edgar = "mip_connector_sec_edgar.runner:main"
