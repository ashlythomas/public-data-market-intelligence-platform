[project]
name = "mip-enrichment-worker"
version = "0.1.0"
description = "NLP enrichment pipeline worker"
requires-python = ">=3.12"
dependencies = [
    "mip-schemas",
    "mip-database",
    "mip-messaging",
    "mip-model-client",
    "mip-observability",
    "httpx>=0.28",
]

[tool.uv.sources]
mip-schemas = { workspace = true }
mip-database = { workspace = true }
mip-messaging = { workspace = true }
mip-model-client = { workspace = true }
mip-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip_enrichment"]

[project.scripts]
mip-enrichment-worker = "mip_enrichment.worker:main"
