[project]
name = "market-intelligence-platform"
version = "0.1.0"
description = "Public-data market intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/schemas",
    "packages/database",
    "packages/messaging",
    "packages/observability",
    "packages/provenance",
    "packages/source-licensing",
    "packages/model-client",
    "packages/test-fixtures",
    "packages/signal-engine",
    "apps/api",
    "apps/alert-worker",
    "apps/admin-cli",
    "services/connectors/fed",
    "services/connectors/fred",
    "services/connectors/sec-edgar",
    "services/connectors/gdelt",
    "services/normalizer",
    "services/enrichment-worker",
    "services/intelligence-worker",
    "services/model-gateway",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["UP046", "SIM102", "SIM108", "B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]
"tests/**" = ["E501"]
"packages/**" = ["E501"]
"apps/**" = ["E501"]
"services/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
