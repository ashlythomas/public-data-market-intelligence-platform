[project]
name = "mip-alert-worker"
version = "0.1.0"
description = "Alert delivery worker"
requires-python = ">=3.12"
dependencies = [
    "mip-database",
    "mip-messaging",
    "mip-observability",
    "httpx>=0.28",
]

[tool.uv.sources]
mip-database = { workspace = true }
mip-messaging = { workspace = true }
mip-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip_alert_worker"]
