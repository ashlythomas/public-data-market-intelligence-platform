[project]
name = "mip-admin-cli"
version = "0.1.0"
description = "Admin CLI for market intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "mip-database",
    "click>=8.1",
]

[tool.uv.sources]
mip-database = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip_admin_cli"]

[project.scripts]
mip-admin = "mip_admin_cli.main:cli"
