[project]
name = "mip-api"
version = "0.1.0"
description = "Market intelligence REST API"
requires-python = ">=3.12"
dependencies = [
    "mip-schemas",
    "mip-database",
    "mip-messaging",
    "mip-observability",
    "mip-source-licensing",
    "mip-model-client",
    "mip-signal-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "opensearch-py>=2.7",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
]

[tool.uv.sources]
mip-schemas = { workspace = true }
mip-database = { workspace = true }
mip-messaging = { workspace = true }
mip-observability = { workspace = true }
mip-source-licensing = { workspace = true }
mip-model-client = { workspace = true }
mip-signal-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mip_api"]

[project.scripts]
mip-api = "mip_api.main:run"
