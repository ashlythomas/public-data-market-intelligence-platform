services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mip
      POSTGRES_PASSWORD: mip_dev_password
      POSTGRES_DB: market_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mip -d market_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/mip-raw;
      mc mb --ignore-existing local/mip-processed;
      exit 0;
      "

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      ALLOW_DEV_AUTH: "true"
      APP_NAME: market-intelligence-api
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://mip:mip_dev_password@postgres:5432/market_intelligence
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_RAW: mip-raw
      OPENSEARCH_URL: http://opensearch:9200
      CLICKHOUSE_URL: http://clickhouse:8123
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_GATEWAY_URL: http://model-gateway:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  model-gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.model-gateway
    ports:
      - "8001:8001"
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.dashboard
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

  normalizer-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.workers
    command: mip-normalizer-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://mip:mip_dev_password@postgres:5432/market_intelligence
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_RAW: mip-raw
      OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      - kafka
      - postgres
      - minio
      - opensearch

  enrichment-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.workers
    command: mip-enrichment-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://mip:mip_dev_password@postgres:5432/market_intelligence
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MODEL_GATEWAY_URL: http://model-gateway:8001
    depends_on:
      - kafka
      - postgres
      - model-gateway

  intelligence-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.workers
    command: mip-intelligence-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://mip:mip_dev_password@postgres:5432/market_intelligence
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka
      - postgres

  alert-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.workers
    command: python -m mip_alert_worker.runner
    environment:
      DATABASE_URL: postgresql+asyncpg://mip:mip_dev_password@postgres:5432/market_intelligence
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka
      - postgres

volumes:
  postgres_data:
  minio_data:
  opensearch_data:
  clickhouse_data:
  mlflow_data:
