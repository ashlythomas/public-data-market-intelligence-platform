name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mip
          POSTGRES_PASSWORD: mip_dev_password
          POSTGRES_DB: market_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy packages apps services --ignore-missing-imports
        continue-on-error: true

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://mip:mip_dev_password@localhost:5432/market_intelligence
        run: uv run alembic -c migrations/alembic.ini upgrade head

      - name: Unit tests
        run: uv run pytest tests/unit tests/contract -v --tb=short

      - name: Schema validation
        run: uv run python -c "from mip_schemas import *; print('Schemas OK')"

  build-containers:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t mip-api:test .

      - name: Build model gateway image
        run: docker build -f infra/docker/Dockerfile.model-gateway -t mip-model-gateway:test .
